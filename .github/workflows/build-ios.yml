name: Build VisionClaw iOS - Fixed Meta Callback

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout VisionClaw
        uses: actions/checkout@v4
        with:
          repository: Intent-Lab/VisionClaw
          ref: d105a39fa050dda82905babd0ba830c18bb2f9d2
          fetch-depth: 1

      - name: Create Secrets.swift
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          cp \
            samples/CameraAccess/CameraAccess/Secrets.swift.example \
            samples/CameraAccess/CameraAccess/Secrets.swift

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("samples/CameraAccess/CameraAccess/Secrets.swift")
          text = path.read_text()

          key = os.environ["GEMINI_API_KEY"].strip()

          if not key:
              raise SystemExit("GEMINI_API_KEY is empty")

          text = text.replace("YOUR_GEMINI_API_KEY", key)
          path.write_text(text)
          PY

      - name: Fix Meta callback URL
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          path = Path("samples/CameraAccess/CameraAccess/Info.plist")

          with path.open("rb") as f:
              plist = plistlib.load(f)

          plist["CFBundleURLTypes"] = [
              {
                  "CFBundleTypeRole": "Editor",
                  "CFBundleURLName": "$(PRODUCT_BUNDLE_IDENTIFIER)",
                  "CFBundleURLSchemes": [
                      "cameraaccess",
                      "visionclaw"
                  ]
              }
          ]

          if "MWDAT" not in plist:
              plist["MWDAT"] = {}

          plist["MWDAT"]["AppLinkURLScheme"] = "cameraaccess://"

          with path.open("wb") as f:
              plistlib.dump(plist, f, sort_keys=False)

          print("Fixed callback schemes:")
          print(plist["CFBundleURLTypes"])
          print("MWDAT callback:", plist["MWDAT"]["AppLinkURLScheme"])
          PY

      - name: Verify configuration
        run: |
          set -e

          SECRETS="samples/CameraAccess/CameraAccess/Secrets.swift"
          PLIST="samples/CameraAccess/CameraAccess/Info.plist"

          if grep -q "YOUR_GEMINI_API_KEY" "$SECRETS"; then
            echo "Gemini key was not inserted"
            exit 1
          fi

          /usr/libexec/PlistBuddy \
            -c "Print :MWDAT:AppLinkURLScheme" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleURLTypes" \
            "$PLIST"

      - name: Resolve packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project samples/CameraAccess/CameraAccess.xcodeproj

      - name: Clean
        run: |
          rm -rf build Payload VisionClaw.ipa

      - name: Build VisionClaw
        run: |
          set -o pipefail

          xcodebuild \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create IPA
        run: |
          set -e

          APP="build/Build/Products/Release-iphoneos/CameraAccess.app"

          mkdir -p Payload
          cp -R "$APP" Payload/

          zip -qry VisionClaw.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-Fixed-Meta
          path: VisionClaw.ipa
          if-no-files-found: error
