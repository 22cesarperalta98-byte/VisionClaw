name: Build Clean VisionClaw iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout latest VisionClaw
        uses: actions/checkout@v4
        with:
          repository: Intent-Lab/VisionClaw
          ref: main

      - name: Create Secrets.swift
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          cp samples/CameraAccess/CameraAccess/Secrets.swift.example \
             samples/CameraAccess/CameraAccess/Secrets.swift

          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path("samples/CameraAccess/CameraAccess/Secrets.swift")
          text = p.read_text()

          key = os.environ["GEMINI_API_KEY"].strip()

          if not key:
              raise SystemExit("GEMINI_API_KEY is missing")

          text = text.replace("YOUR_GEMINI_API_KEY", key)

          p.write_text(text)
          PY

      - name: Verify callback configuration
        run: |
          PLIST="samples/CameraAccess/CameraAccess/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleURLTypes" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Print :MWDAT:AppLinkURLScheme" \
            "$PLIST"

      - name: Resolve packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project samples/CameraAccess/CameraAccess.xcodeproj

      - name: Build VisionClaw
        run: |
          rm -rf build Payload VisionClaw.ipa

          xcodebuild \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/CameraAccess.app"

          if [ ! -d "$APP" ]; then
            echo "CameraAccess.app missing"
            exit 1
          fi

          mkdir Payload
          cp -R "$APP" Payload/

          zip -qry VisionClaw.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-Clean
          path: VisionClaw.ipa
          if-no-files-found: error
