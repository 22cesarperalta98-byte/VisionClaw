name: Build VisionClaw iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Secrets.swift
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cp samples/CameraAccess/CameraAccess/Secrets.swift.example \
             samples/CameraAccess/CameraAccess/Secrets.swift

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("samples/CameraAccess/CameraAccess/Secrets.swift")
          text = path.read_text()
          text = text.replace(
              "YOUR_GEMINI_API_KEY",
              os.environ["GEMINI_API_KEY"]
          )
          path.write_text(text)
          PY

      - name: Resolve packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project samples/CameraAccess/CameraAccess.xcodeproj

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Make IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CameraAccess.app Payload/
          zip -r VisionClaw.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-iPhone
          path: VisionClaw.ipa
